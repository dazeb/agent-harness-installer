name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The assertions live in ci/gate.sh so that the same payload can run where
# Actions cannot schedule jobs (see ci/run-gate.sh). This job is deliberately
# thin: no duplicated steps, no drift between the two environments.
jobs:
  gate:
    name: ci/gate.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint and smoke test
        run: ./ci/gate.sh
